<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinador Virtual UPYOU - Leitor Via CSV do Strava</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 800px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { text-align: center; color: #f8fafc; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; }
    .upload-area:hover { border-color: #fc5200; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; background: #fc5200; color: white; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; margin-top: 10px; }
    .results { margin-top: 25px; display: none; }
    .stat-box { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #fc5200; }
    .stat-title { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
    #statusMsg { color: #38bdf8; font-weight: bold; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Treinador Virtual UPYOU <br><span style="font-size: 1rem; color: #94a3b8;">Busca via CSV: 25 de out. de 2026</span></h1>
    
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o seu ficheiro ZIP do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div id="statusMsg"></div>

    <div class="results" id="results">
      <h3 id="actInfo" style="color: #38bdf8; margin-bottom: 15px;"></h3>
      <div class="stat-box">
        <div class="stat-title">Ficheiro Localizado no CSV</div>
        <div class="stat-val" id="fileNameDisp" style="font-size: 0.95rem; color: #94a3b8;">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Status do Processamento</div>
        <div class="stat-val" id="processStatus">Aguardando ficheiro...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('zipInput').addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('statusMsg').innerText = 'A abrir o ZIP e a ler o activities.csv...';

      setTimeout(async () => {
        try {
          const jszip = new JSZip();
          const zip = await jszip.loadAsync(file);
          
          // 1. Localizar o ficheiro activities.csv na raiz do ZIP
          let csvEntry = null;
          zip.forEach((relativePath, zipEntry) => {
            if (relativePath.toLowerCase() === 'activities.csv' || relativePath.toLowerCase().endsWith('/activities.csv')) {
              csvEntry = zipEntry;
            }
          });

          if (!csvEntry) {
            throw new Error("O ficheiro 'activities.csv' não foi encontrado na raiz do ZIP do Strava.");
          }

          const csvText = await csvEntry.async("string");
          const lines = csvText.split('\n');

          let targetFileName = "";
          let targetDateStr = "";

          // 2. Procurar na tabela a linha correspondente a "25 de out. de 2026"
          for (let i = 1; i < lines.length; i++) {
            const line = lines[i];
            if (line.includes('25 de out. de 2026')) {
              targetDateStr = "25 de out. de 2026";
              
              // O CSV do Strava guarda o caminho do ficheiro numa coluna específica. Vamos extrair procurando por .fit.gz, .gpx.gz ou .tcx.gz
              const matchFile = line.match(/(activities\/[^,"]+\.(fit|gpx|tcx)\.gz)/i);
              if (matchFile) {
                targetFileName = matchFile[1];
              }
              break;
            }
          }

          if (!targetFileName) {
            throw new Error("A data '25 de out. de 2026' foi encontrada no CSV, mas o nome do ficheiro associado não foi localizado.");
          }

          document.getElementById('statusMsg').innerText = `Ficheiro mapeado com sucesso: ${targetFileName}. A procurar no ZIP...`;

          // 3. Ir diretamente buscar o ficheiro encontrado pelo CSV dentro do ZIP
          let targetActivityEntry = null;
          zip.forEach((relativePath, zipEntry) => {
            if (relativePath.toLowerCase().includes(targetFileName.toLowerCase())) {
              targetActivityEntry = zipEntry;
            }
          });

          if (!targetActivityEntry) {
            throw new Error(`O ficheiro ${targetFileName} indicado no CSV não foi encontrado dentro do ZIP.`);
          }

          document.getElementById('statusMsg').innerText = '';
          document.getElementById('results').style.display = 'block';
          document.getElementById('actInfo').innerText = `Atividade de ${targetDateStr}`;
          document.getElementById('fileNameDisp').innerText = targetFileName;
          document.getElementById('processStatus').innerText = 'Mapeamento concluído com sucesso via CSV!';

        } catch (err) {
          document.getElementById('statusMsg').style.color = '#f87171';
          document.getElementById('statusMsg').innerText = 'Erro: ' + err.message;
        }
      }, 150);
    });
  </script>
</body>
</html>
