<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análise de Treinos Strava</title>
  <!-- Biblioteca JSZip via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      text-align: center;
    }
    .upload-area {
      border: 2px dashed #475569;
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .upload-area:hover {
      border-color: #fc5200; /* Cor Strava */
    }
    input[type="file"] {
      display: none;
    }
    .btn {
      display: inline-block;
      background: #fc5200;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .progress-box {
      margin-top: 25px;
      display: none;
    }
    .progress-bar-bg {
      background: #334155;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: #fc5200;
      width: 0%;
      height: 100%;
      transition: width 0.1s;
    }
    .status-text {
      margin-top: 8px;
      font-size: 0.875rem;
      color: #94a3b8;
      text-align: center;
    }
    .results {
      margin-top: 25px;
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .results p {
      margin: 6px 0;
    }
    .success {
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Analisador de Dados Strava</h1>
    
    <div class="upload-area" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o ficheiro ZIP exportado do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">A preparar descompressão...</div>
    </div>

    <div class="results" id="resultsBox">
      <h3 style="margin-top: 0;">Ficheiros Identificados:</h3>
      <p id="csvStatus"></p>
      <p id="fitCountStatus"></p>
    </div>
  </div>

  <script>
    const zipInput = document.getElementById('zipInput');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const resultsBox = document.getElementById('resultsBox');
    const csvStatus = document.getElementById('csvStatus');
    const fitCountStatus = document.getElementById('fitCountStatus');

    zipInput.addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      // Exibir elementos de progresso
      progressBox.style.display = 'block';
      resultsBox.style.display = 'none';
      progressBar.style.width = '0%';
      statusText.innerText = 'A carregar ficheiro ZIP na memória...';

      try {
        const jszip = new JSZip();
        
        // Carrega o ZIP lendo metadados e estrutura interna
        const zip = await jszip.loadAsync(file, {
          onUpdate: (metadata) => {
            const percent = metadata.percent.toFixed(0);
            progressBar.style.width = percent + '%';
            statusText.innerText = `A descompactar estrutura: ${percent}%`;
          }
        });

        statusText.innerText = 'Estrutura descompactada! A mapear ficheiros...';

        let csvFile = null;
        let fitFiles = [];

        // Percorrer a lista de ficheiros contidos no ZIP
        zip.forEach((relativePath, zipEntry) => {
          if (relativePath.endsWith('activities.csv')) {
            csvFile = zipEntry;
          } else if (relativePath.endsWith('.fit.gz') || relativePath.endsWith('.fit')) {
            fitFiles.push(zipEntry);
          }
        });

        // Mostrar resumo
        progressBox.style.display = 'none';
        resultsBox.style.display = 'block';

        if (csvFile) {
          csvStatus.innerHTML = `<span class="success">✓</span> activities.csv encontrado (${(csvFile._data.uncompressedSize / 1024).toFixed(1)} KB)`;
        } else {
          csvStatus.innerHTML = `<span style="color: #f87171;">✗</span> activities.csv não encontrado no arquivo.`;
        }

        fitCountStatus.innerHTML = `<span class="success">✓</span> ${fitFiles.length} atividades (.fit / .fit.gz) localizadas.`;

        // Disponibilizar referências globais para a próxima etapa
        window.stravaZip = zip;
        window.stravaCsvEntry = csvFile;
        window.stravaFitEntries = fitFiles;

      } catch (err) {
        statusText.innerText = 'Erro ao processar ficheiro: ' + err.message;
        progressBar.style.backgroundColor = '#ef4444';
      }
    });
  </script>
</body>
</html>
