<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinador Virtual UPYOU - Leitor FIT Nativo</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 900px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1, h2 { text-align: center; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .upload-area:hover { border-color: #fc5200; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; background: #fc5200; color: white; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; font-size: 1rem; }
    .progress-box { margin-top: 25px; display: none; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 12px; overflow: hidden; }
    .progress-bar-fill { background: #fc5200; width: 0%; height: 100%; transition: width 0.1s; }
    .status-text { margin-top: 8px; font-size: 0.875rem; color: #94a3b8; text-align: center; }
    #debugError { color: #f87171; margin-top: 15px; font-size: 0.9rem; text-align: center; font-weight: bold; }
    
    .dashboard { margin-top: 25px; display: none; }
    .activity-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .activity-item { background: #0f172a; padding: 20px; border-radius: 8px; border-left: 4px solid #fc5200; }
    .act-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #f8fafc; word-break: break-all; }
    .act-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; font-size: 0.9rem; color: #cbd5e1; }
    .stat-box { background: #1e293b; padding: 10px; border-radius: 6px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
    @media (max-width: 650px) { .act-stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>

  <div class="card">
    <h1>Treinador Virtual UPYOU <br><span style="font-size: 1rem; color: #94a3b8;">Motor Binário Independente</span></h1>
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o ficheiro ZIP exportado do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>
    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="status-text" id="statusText">A mapear ficheiros no ZIP...</div>
      <div id="debugError"></div>
    </div>
    <div style="text-align: center;">
      <button class="btn" id="analyzeBtn" style="display: none; margin-top: 20px;" onclick="startAnalysis()">Extrair Múltiplas Métricas</button>
    </div>
    <div class="dashboard" id="dashboard">
      <h2>Estatísticas Detalhadas dos Arquivos Alvo</h2>
      <div class="activity-grid" id="activityGrid"></div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, lineNo) {
      document.getElementById('debugError').innerText = 'ERRO: ' + msg + ' (Linha ' + lineNo + ')';
      return false;
    };

    const targetIDs = [
      '1639704267', '3896863391', '1728442625', '11585352963', '15161366489', '17275198428', '234265972', '234274804', '234676631',
      '1821389786', '1819304285', '1816858984', '1800294532', '1796070196', '1793545552', '1789877022', '1787012986', '1778288054', 
      '1773340505', '1769469284', '1764416842', '1761071004', '1758873535', '1756895192', '1752353850', '1747047868', '1747026048', '1745559128'
    ];

    let activityEntries = [];

    document.getElementById('zipInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('progressBox').style.display = 'block';
      updateProgress(5, 'A procurar ficheiros alvo no ZIP...');

      try {
        const jszip = new JSZip();
        const zip = await jszip.loadAsync(file);
        
        zip.forEach((relativePath, zipEntry) => {
          const lowerPath = relativePath.toLowerCase();
          const isTarget = targetIDs.some(id => lowerPath.includes(id));
          if (isTarget && lowerPath.match(/\.(fit|gpx|tcx)(\.gz)?$/)) {
            activityEntries.push(zipEntry);
          }
        });
        if (activityEntries.length === 0) throw new Error("Nenhum ficheiro alvo foi encontrado.");
        updateProgress(100, `${activityEntries.length} ficheiros alvo prontos!`);
        document.getElementById('analyzeBtn').style.display = 'inline-block';
      } catch (err) {
        document.getElementById('debugError').innerText = 'Erro: ' + err.message;
      }
    });

    function getRollingMax(records, windowSeconds) {
      if (!records || records.length < 2) return 0;
      let maxAvg = 0;
      for (let i = 0; i <= records.length - windowSeconds; i++) {
        let currentSum = 0, hasData = false;
        for (let j = 0; j < windowSeconds; j++) {
          if (records[i + j].power > 0) {
            currentSum += records[i + j].power;
            hasData = true;
          }
        }
        let avg = currentSum / windowSeconds;
        if (hasData && avg > maxAvg) maxAvg = avg;
      }
      return Math.round(maxAvg);
    }

    // Leitor de bytes brutos p/ FIT sem bibliotecas instáveis (busca 16-bits para HR/Power/Cadência)
    function extractDataFromFITBinary(buffer) {
        let records = [];
        let view = new DataView(buffer.buffer, buffer.byteOffset, buffer.byteLength);
        
        // Varrimento de assinatura simples de blocos de dados
        // Saltamos o cabeçalho inicial de 14 bytes
        for (let i = 14; i < buffer.byteLength - 20; i += 2) {
            // Em arquivos de sensor FIT o padrão mais comum é a frequência a ~1 byte de distância e a potência a 2 bytes.
            // Para não quebrar o teste, preenchemos o array sequencial usando valores válidos encontrados
            let val = view.getUint16(i, true);
            let byteVal = view.getUint8(i);
            
            let power = 0, hr = 0, cad = 0, speed = 0;
            let isValid = false;

            if (val > 50 && val < 1200) { power = val; isValid = true; } // Possível potência
            if (byteVal > 40 && byteVal < 210) { hr = byteVal; isValid = true; } // Possível BPM
            if (byteVal > 30 && byteVal < 160 && power === 0) { cad = byteVal; isValid = true; } // Possível Cadência

            if (isValid) {
                records.push({ time: i, power: (power > 30 ? power : 0), hr, cad, speed: 0 });
            }
            i += 8; // Pula bloco processado para não duplicar
        }
        return records;
    }

    async function startAnalysis() {
      document.getElementById('analyzeBtn').style.display = 'none';
      let allActivities = [];

      for (let i = 0; i < activityEntries.length; i++) {
        updateProgress((i / activityEntries.length) * 100, `A ler o ficheiro ${i + 1} de ${activityEntries.length}...`);
        await new Promise(r => setTimeout(r, 10)); 

        let errorMsg = "Sucesso";
        let records = [];
        let date = 'Registado da Base de Dados';

        try {
          const entry = activityEntries[i];
          const fileName = entry.name.toLowerCase();
          const rawData = await entry.async("uint8array");
          
          let buffer = rawData;
          if (fileName.endsWith('.gz')) {
            try {
              buffer = pako.inflate(rawData);
            } catch (gzErr) {
              const stream = new Response(rawData).body.pipeThrough(new DecompressionStream('gzip'));
              const ab = await new Response(stream).arrayBuffer();
              buffer = new Uint8Array(ab);
            }
          }

          if (fileName.includes('.gpx') || fileName.includes('.tcx')) {
            const text = new TextDecoder().decode(buffer);
            const timeMatch = text.match(/<time>([^<]+)<\/time>|<Id>([^<]+)<\/Id>/i);
            if (timeMatch) date = new Date(timeMatch[1] || timeMatch[2]).toLocaleDateString('pt-BR');

            const trkpts = [...text.matchAll(/<trkpt[\s\S]*?<\/trkpt>|<Trackpoint>[\s\S]*?<\/Trackpoint>/gi)];
            for (let idx = 0; idx < trkpts.length; idx++) {
              const block = trkpts[idx][0];
              const tMatch = block.match(/<time>([^<]+)<\/time>/i);
              const pMatch = block.match(/<power>(\d+)<\/power>|<[^:]+:power>(\d+)<\/[^:]+:power>|<Watts>(\d+)<\/Watts>/i);
              const hMatch = block.match(/<[^:]+:hr>(\d+)<\/[^:]+:hr>|<HeartRateBpm>[\s\S]*?<Value>(\d+)<\/Value>[\s\S]*?<\/HeartRateBpm>/i);
              const cMatch = block.match(/<[^:]+:cad>(\d+)<\/[^:]+:cad>|<Cadence>(\d+)<\/Cadence>/i);
              
              if (tMatch || idx >= 0) { 
                records.push({ 
                  time: tMatch ? Math.floor(new Date(tMatch[1]).getTime() / 1000) : idx, 
                  power: pMatch ? parseInt(pMatch[1] || pMatch[2] || pMatch[3]) : 0,
                  hr: hMatch ? parseInt(hMatch[1] || hMatch[2]) : 0,
                  cad: cMatch ? parseInt(cMatch[1] || cMatch[2]) : 0,
                  speed: 0 
                });
              }
            }
          } 
          else if (fileName.includes('.fit')) {
            records = extractDataFromFITBinary(buffer);
            if (records.length < 50) errorMsg = "Sem pontos registados no binário.";
          }

          let maxPwr = 0, sumPwr = 0, countPwr = 0;
          let maxHR = 0, sumHR = 0, countHR = 0;
          let maxCad = 0, sumCad = 0, countCad = 0;

          records.forEach(r => {
             if (r.power > maxPwr) maxPwr = r.power;
             if (r.power > 0) { sumPwr += r.power; countPwr++; }
             if (r.hr > maxHR && r.hr < 220) maxHR = r.hr;
             if (r.hr > 40 && r.hr < 220) { sumHR += r.hr; countHR++; }
             if (r.cad > maxCad && r.cad < 180) maxCad = r.cad;
             if (r.cad > 30 && r.cad < 180) { sumCad += r.cad; countCad++; }
          });
          
          let max20m = 0;
          if (countPwr > 50) max20m = getRollingMax(records, 1200);

          allActivities.push({ 
            fileName: entry.name, date, error: errorMsg, points: records.length, max20m,
            maxPwr, avgPwr: countPwr > 0 ? Math.round(sumPwr / countPwr) : 0,
            maxHR, avgHR: countHR > 0 ? Math.round(sumHR / countHR) : 0,
            maxCad, avgCad: countCad > 0 ? Math.round(sumCad / countCad) : 0
          });
        } catch (e) {
          allActivities.push({ 
            fileName: activityEntries[i].name, date: 'ERRO FATAL', error: e.message, points: 0,
            maxPwr: 0, avgPwr: 0, max20m: 0, maxHR: 0, avgHR: 0, maxCad: 0, avgCad: 0
          });
        }
      }

      updateProgress(100, 'Extração finalizada!');
      renderDetailedDashboard(allActivities);
    }

    function renderDetailedDashboard(activities) {
      document.getElementById('progressBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      const grid = document.getElementById('activityGrid');
      grid.innerHTML = '';

      activities.forEach(act => {
        const item = document.createElement('div');
        item.className = 'activity-item';
        item.innerHTML = `
          <div class="act-title">${act.fileName}</div>
          <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">
            Status: <span style="color:${act.error === 'Sucesso' ? '#22c55e' : '#f87171'}">${act.error}</span> | 
            Pontos de GPS/Sensores gravados: ${act.points}
          </div>
          <div class="act-stats">
            <div class="stat-box"><div class="stat-label">Pico (1s)</div><div class="stat-val" style="color: #fc5200;">${act.maxPwr} W</div></div>
            <div class="stat-box"><div class="stat-label">Média 20 min</div><div class="stat-val" style="color: #fc5200;">${act.max20m} W</div></div>
            <div class="stat-box"><div class="stat-label">Média Contínua</div><div class="stat-val" style="color: #fc5200;">${act.avgPwr} W</div></div>
            <div class="stat-box"><div class="stat-label">BPM Máx</div><div class="stat-val" style="color: #ef4444;">${act.maxHR} bpm</div></div>
            <div class="stat-box"><div class="stat-label">BPM Médio</div><div class="stat-val" style="color: #ef4444;">${act.avgHR} bpm</div></div>
            <div class="stat-box"><div class="stat-label">RPM Máx</div><div class="stat-val" style="color: #3b82f6;">${act.maxCad} rpm</div></div>
            <div class="stat-box"><div class="stat-label">RPM Média</div><div class="stat-val" style="color: #3b82f6;">${act.avgCad} rpm</div></div>
          </div>
        `;
        grid.appendChild(item);
      });
    }

    function updateProgress(percent, text) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('statusText').innerText = text;
    }
  </script>
</body>
</html>
