<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinador Virtual UPYOU - Diagnóstico</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.9.0/dist/fit-parser.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 700px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1, h2 { text-align: center; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; }
    .upload-area:hover { border-color: #fc5200; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; background: #fc5200; color: white; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; font-size: 1rem; }
    .progress-box { margin-top: 25px; display: none; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 12px; overflow: hidden; }
    .progress-bar-fill { background: #fc5200; width: 0%; height: 100%; transition: width 0.1s; }
    .status-text { margin-top: 8px; font-size: 0.875rem; color: #94a3b8; text-align: center; }
    #debugError { color: #f87171; margin-top: 15px; font-size: 0.9rem; text-align: center; font-weight: bold; }
    .dashboard { margin-top: 25px; display: none; background: #0f172a; padding: 20px; border-radius: 8px; max-height: 400px; overflow-y: auto; }
    .log-item { background: #1e293b; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 0.85rem; border-left: 3px solid #fc5200; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Treinador Virtual UPYOU (Modo Diagnóstico)</h1>
    
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o ficheiro ZIP exportado do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">A iniciar diagnóstico...</div>
      <div id="debugError"></div>
    </div>

    <div style="text-align: center;">
      <button class="btn" id="analyzeBtn" style="display: none; margin-top: 20px;" onclick="startAnalysis()">Executar Diagnóstico de Potência</button>
    </div>

    <div class="dashboard" id="dashboard">
      <h2>Log de Atividades com Potência Real Detetada</h2>
      <div id="logList"></div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, lineNo) {
      document.getElementById('debugError').innerText = 'ERRO: ' + msg + ' (Linha: ' + lineNo + ')';
      return false;
    };

    let activityEntries = [];
    let parser = null;

    document.getElementById('zipInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('progressBox').style.display = 'block';
      updateProgress(5, 'A descompactar ZIP...');

      await new Promise(resolve => setTimeout(resolve, 200));

      try {
        const jszip = new JSZip();
        const zip = await jszip.loadAsync(file);
        
        activityEntries = [];
        zip.forEach((relativePath, zipEntry) => {
          const lowerPath = relativePath.toLowerCase();
          if (lowerPath.match(/\.(fit|gpx|tcx)(\.gz)?$/)) {
            activityEntries.push(zipEntry);
          }
        });

        updateProgress(100, `${activityEntries.length} ficheiros localizados.`);
        document.getElementById('analyzeBtn').style.display = 'inline-block';

      } catch (err) {
        document.getElementById('debugError').innerText = 'Erro: ' + err.message;
      }
    });

    function parseFitFile(buffer) {
      return new Promise((resolve) => {
        if (!parser) parser = new window.FitParser({ force: true });
        parser.parse(buffer, (error, data) => {
          if (error || !data || !data.records) resolve(null);
          else resolve(data);
        });
      });
    }

    async function startAnalysis() {
      document.getElementById('analyzeBtn').style.display = 'none';
      let foundCount = 0;
      const logList = document.getElementById('logList');
      logList.innerHTML = '';

      for (let i = 0; i < activityEntries.length; i++) {
        if (i % 5 === 0) {
          updateProgress((i / activityEntries.length) * 100, `A testar ficheiro ${i + 1} de ${activityEntries.length}...`);
          await new Promise(r => setTimeout(r, 0)); 
        }

        try {
          const entry = activityEntries[i];
          const fileName = entry.name.toLowerCase();
          const rawData = await entry.async("uint8array");
          
          let buffer = rawData;
          if (fileName.endsWith('.gz')) {
            try { buffer = pako.inflate(rawData); } catch(e) {}
          }

          let powers = [];
          let date = 'Data desconhecida';

          if (fileName.includes('.gpx') || fileName.includes('.tcx')) {
            const text = new TextDecoder().decode(buffer);
            const timeMatch = text.match(/<time>([^<]+)<\/time>|<Id>([^<]+)<\/Id>/i);
            if (timeMatch) date = new Date(timeMatch[1] || timeMatch[2]).toLocaleDateString('pt-BR');

            const pMatches = [...text.matchAll(/<power>(\d+)<\/power>|<[^:]+:power>(\d+)<\/[^:]+:power>|<Watts>(\d+)<\/Watts>/gi)];
            powers = pMatches.map(m => parseInt(m[1] || m[2] || m[3] || 0)).filter(p => p > 0);
          } 
          else if (fileName.includes('.fit')) {
            let arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);
            const data = await parseFitFile(arrayBuffer);
            if (data && data.records) {
              powers = data.records.map(r => r.power).filter(p => p !== undefined && p !== null && p > 0);
              if (data.sessions && data.sessions[0] && data.sessions[0].start_time) {
                date = new Date(data.sessions[0].start_time).toLocaleDateString('pt-BR');
              }
            }
          }

          // Se encontrou dados de potência válidos nesta atividade
          if (powers.length > 10) {
            foundCount++;
            const sum = powers.reduce((a, b) => a + b, 0);
            const realAvg = Math.round(sum / powers.length);
            const maxP = Math.max(...powers);

            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `<strong>[${foundCount}] Data: ${date}</strong> — Ficheiro: ${entry.name}<br>Pontos de potência: ${powers.length} | Potência Média (sem zeros): ${realAvg} W | Pico: ${maxP} W`;
            logList.appendChild(div);
          }
        } catch (e) {
          // Ignora erros individuais
        }
      }

      updateProgress(100, 'Diagnóstico concluído!');
      document.getElementById('progressBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';

      if (foundCount === 0) {
        logList.innerHTML = '<div class="log-item" style="border-color: #ef4444;">Nenhum ficheiro com tag de potência explícita foi detetado.</div>';
      }
    }

    function updateProgress(percent, text) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('statusText').innerText = text;
    }
  </script>
</body>
</html>
