<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinador Virtual UPYOU - Teste Isolado</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.9.0/dist/fit-parser.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 800px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1, h2 { text-align: center; margin-bottom: 20px; }
    .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .upload-area:hover { border-color: #fc5200; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; background: #fc5200; color: white; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; font-size: 1rem; }
    .progress-box { margin-top: 25px; display: none; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 12px; overflow: hidden; }
    .progress-bar-fill { background: #fc5200; width: 0%; height: 100%; transition: width 0.1s; }
    .status-text { margin-top: 8px; font-size: 0.875rem; color: #94a3b8; text-align: center; }
    #debugError { color: #f87171; margin-top: 15px; font-size: 0.9rem; text-align: center; font-weight: bold; }
    
    .dashboard { margin-top: 25px; display: none; }
    .activity-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
    .activity-item { background: #0f172a; padding: 20px; border-radius: 8px; border-left: 4px solid #fc5200; }
    .act-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #f8fafc; word-break: break-all; }
    .act-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 0.9rem; color: #cbd5e1; }
    .stat-box { background: #1e293b; padding: 10px; border-radius: 6px; text-align: center; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Treinador Virtual UPYOU <br><span style="font-size: 1rem; color: #94a3b8;">Teste de Arquivos Específicos</span></h1>
    
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o ficheiro ZIP gigante exportado do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">A mapear ficheiros no ZIP...</div>
      <div id="debugError"></div>
    </div>

    <div style="text-align: center;">
      <button class="btn" id="analyzeBtn" style="display: none; margin-top: 20px;" onclick="startAnalysis()">Analisar Arquivos Específicos</button>
    </div>

    <div class="dashboard" id="dashboard">
      <h2>Estatísticas Completas dos Ficheiros</h2>
      <div class="activity-grid" id="activityGrid"></div>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, lineNo) {
      document.getElementById('debugError').innerText = 'ERRO: ' + msg + ' (Linha ' + lineNo + ')';
      return false;
    };

    // A LISTA DE ARQUIVOS QUE VOCÊ PEDIU
    const targetIDs = [
      '1639704267', '3896863391', '1728442625', 
      '11585352963', '15161366489', '17275198428', 
      '234265972', '234274804', '234676631'
    ];

    let activityEntries = [];
    let parser = null;

    document.getElementById('zipInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('progressBox').style.display = 'block';
      updateProgress(5, 'A procurar os 9 ficheiros específicos no ZIP gigante...');

      await new Promise(resolve => setTimeout(resolve, 200));

      try {
        const jszip = new JSZip();
        const zip = await jszip.loadAsync(file);
        
        activityEntries = [];
        zip.forEach((relativePath, zipEntry) => {
          const lowerPath = relativePath.toLowerCase();
          const isTarget = targetIDs.some(id => lowerPath.includes(id));
          
          if (isTarget && lowerPath.match(/\.(fit|gpx|tcx)(\.gz)?$/)) {
            activityEntries.push(zipEntry);
          }
        });

        if (activityEntries.length === 0) {
          throw new Error("Nenhum dos 9 ficheiros procurados foi encontrado dentro do ZIP.");
        }

        updateProgress(100, `${activityEntries.length} ficheiros alvo localizados!`);
        document.getElementById('analyzeBtn').style.display = 'inline-block';

      } catch (err) {
        document.getElementById('debugError').innerText = 'Erro: ' + err.message;
      }
    });

    function getRollingMax(records, windowSeconds) {
      if (!records || records.length < 2) return 0;
      let startTime = records[0].time;
      let endTime = records[records.length - 1].time;
      if (endTime - startTime < windowSeconds) return 0;

      let dense = new Int16Array(endTime - startTime + 1);
      let recIdx = 0;
      for (let t = 0; t <= (endTime - startTime); t++) {
        let currentTime = startTime + t;
        while (recIdx < records.length - 1 && records[recIdx + 1].time <= currentTime) recIdx++;
        
        let timeDiff = currentTime - records[recIdx].time;
        if (timeDiff > 10) dense[t] = 0; 
        else dense[t] = records[recIdx].power;
      }

      let maxAvg = 0;
      for (let i = 0; i <= dense.length - windowSeconds; i++) {
        let currentSum = 0;
        let hasData = false;
        for (let j = 0; j < windowSeconds; j++) {
          currentSum += dense[i + j];
          if (dense[i + j] > 0) hasData = true;
        }
        let avg = currentSum / windowSeconds;
        if (hasData && avg > maxAvg) maxAvg = avg;
      }
      return Math.round(maxAvg);
    }

    function parseFitFile(buffer) {
      return new Promise((resolve) => {
        if (!parser) parser = new window.FitParser({ force: true });
        parser.parse(buffer, (error, data) => {
          if (error || !data || !data.records) resolve(null);
          else resolve(data);
        });
      });
    }

    function formatDuration(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      return `${h}h ${m}m`;
    }

    async function startAnalysis() {
      document.getElementById('analyzeBtn').style.display = 'none';
      let allActivities = [];

      for (let i = 0; i < activityEntries.length; i++) {
        updateProgress((i / activityEntries.length) * 100, `A processar ficheiro ${i + 1} de ${activityEntries.length}...`);
        await new Promise(r => setTimeout(r, 10)); 

        try {
          const entry = activityEntries[i];
          const fileName = entry.name.toLowerCase();
          const rawData = await entry.async("uint8array");
          
          let buffer = rawData;
          // Descompressão à prova de balas
          if (fileName.endsWith('.gz')) {
            try {
              buffer = pako.inflate(rawData);
            } catch (gzErr) {
              console.warn("Pako falhou no ficheiro", fileName, "Tornando a tentar com API nativa...");
              const stream = new Response(rawData).body.pipeThrough(new DecompressionStream('gzip'));
              const ab = await new Response(stream).arrayBuffer();
              buffer = new Uint8Array(ab);
            }
          }

          let powerRecords = [];
          let ascent = 0;
          let date = 'Data desconhecida';

          if (fileName.includes('.gpx') || fileName.includes('.tcx')) {
            const text = new TextDecoder().decode(buffer);
            const timeMatch = text.match(/<time>([^<]+)<\/time>|<Id>([^<]+)<\/Id>/i);
            if (timeMatch) date = new Date(timeMatch[1] || timeMatch[2]).toLocaleDateString('pt-BR');

            const eMatches = [...text.matchAll(/<ele>([\d.-]+)<\/ele>|<AltitudeMeters>([\d.-]+)<\/AltitudeMeters>/gi)];
            let lastEle = null;
            for (const m of eMatches) {
              let ele = parseFloat(m[1] || m[2]);
              if (lastEle !== null && ele > lastEle) ascent += (ele - lastEle);
              lastEle = ele;
            }

            const trkpts = [...text.matchAll(/<trkpt[\s\S]*?<\/trkpt>|<Trackpoint>[\s\S]*?<\/Trackpoint>/gi)];
            for (const pt of trkpts) {
              const block = pt[0];
              const tMatch = block.match(/<time>([^<]+)<\/time>/i);
              const pMatch = block.match(/<power>(\d+)<\/power>|<[^:]+:power>(\d+)<\/[^:]+:power>|<Watts>(\d+)<\/Watts>/i);
              if (tMatch && pMatch) {
                const timeStr = Math.floor(new Date(tMatch[1]).getTime() / 1000);
                const pVal = parseInt(pMatch[1] || pMatch[2] || pMatch[3] || 0);
                powerRecords.push({ time: timeStr, power: pVal });
              }
            }
          } 
          else if (fileName.includes('.fit')) {
            let arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);
            const data = await parseFitFile(arrayBuffer);
            if (data && data.records) {
              for (const r of data.records) {
                if (r.timestamp && r.power !== undefined) {
                  powerRecords.push({ time: Math.floor(r.timestamp.getTime() / 1000), power: r.power });
                }
              }
              if (data.sessions && data.sessions[0]) {
                ascent = data.sessions[0].total_ascent || 0;
                date = data.sessions[0].start_time ? new Date(data.sessions[0].start_time).toLocaleDateString('pt-BR') : date;
              }
            }
          }

          powerRecords.sort((a,b) => a.time - b.time);
          const duration = powerRecords.length > 1 ? (powerRecords[powerRecords.length-1].time - powerRecords[0].time) : 0;
          const max20m = getRollingMax(powerRecords, 1200);
          const max1h = getRollingMax(powerRecords, 3600);
          
          let max1s = 0;
          let sumPwr = 0;
          let countValid = 0;
          powerRecords.forEach(r => {
             if (r.power > max1s) max1s = r.power;
             if (r.power > 0) { sumPwr += r.power; countValid++; }
          });
          const avgReal = countValid > 0 ? Math.round(sumPwr / countValid) : 0;
          
          allActivities.push({ 
            fileName: entry.name, date, duration, max1s, avgReal, max20m, max1h, ascent: Math.round(ascent), points: powerRecords.length 
          });
        } catch (e) {
          console.error("Erro total no arquivo", activityEntries[i].name, e);
        }
      }

      updateProgress(100, 'Processamento concluído!');
      renderDetailedDashboard(allActivities);
    }

    function renderDetailedDashboard(activities) {
      document.getElementById('progressBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      const grid = document.getElementById('activityGrid');
      grid.innerHTML = '';

      if (activities.length === 0) {
        grid.innerHTML = '<p style="color:#f87171;">Não conseguimos extrair dados de nenhum dos arquivos alvo.</p>';
        return;
      }

      activities.forEach(act => {
        const item = document.createElement('div');
        item.className = 'activity-item';
        item.innerHTML = `
          <div class="act-title">${act.date} — Ficheiro: ${act.fileName}</div>
          <div style="font-size: 0.8rem; color: #64748b; margin-bottom: 15px;">Duração total da linha temporal: ${formatDuration(act.duration)} | Pontos de energia: ${act.points}</div>
          <div class="act-stats">
            <div class="stat-box">
              <div class="stat-label">Pico Máx (1s)</div>
              <div class="stat-val">${act.max1s} W</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Média Contínua</div>
              <div class="stat-val">${act.avgReal} W</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Melhor 20 min</div>
              <div class="stat-val">${act.max20m} W</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Melhor 1 Hora</div>
              <div class="stat-val">${act.max1h} W</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Ganho Elevação</div>
              <div class="stat-val">${act.ascent} m</div>
            </div>
          </div>
        `;
        grid.appendChild(item);
      });
    }

    function updateProgress(percent, text) {
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('statusText').innerText = text;
    }
  </script>
</body>
</html>
