<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinador Virtual UPYOU - Análise Completa</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fit-file-parser@1.9.0/dist/fit-parser.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 1000px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { text-align: center; margin-bottom: 20px; color: #f8fafc; }
    .upload-area { border: 2px dashed #475569; border-radius: 8px; padding: 30px; text-align: center; cursor: pointer; transition: border-color 0.2s; }
    .upload-area:hover { border-color: #fc5200; }
    input[type="file"] { display: none; }
    .btn { display: inline-block; background: #fc5200; color: white; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; border: none; font-size: 1rem; }
    
    .progress-box { margin-top: 25px; display: none; text-align: center; }
    .progress-bar-bg { background: #334155; border-radius: 6px; height: 12px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { background: #fc5200; width: 0%; height: 100%; transition: width 0.1s; }
    .status-text { font-size: 0.875rem; color: #94a3b8; }
    #debugError { color: #f87171; margin-top: 15px; font-size: 0.9rem; text-align: center; font-weight: bold; }
    
    .dashboard { margin-top: 25px; display: none; }
    
    .pagination { display: flex; justify-content: center; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
    .page-btn { background: #334155; border: none; color: white; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    .page-btn:hover { background: #475569; }
    .page-btn.active { background: #fc5200; font-weight: bold; }

    .activity-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
    .activity-item { background: #0f172a; padding: 20px; border-radius: 8px; border-left: 4px solid #fc5200; }
    .act-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #f8fafc; }
    .act-sub { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }
    
    .act-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .stat-box { background: #1e293b; padding: 10px; border-radius: 6px; text-align: center; }
    .stat-label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
    .stat-val { font-size: 1.1rem; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Treinador Virtual UPYOU <br><span style="font-size: 1rem; color: #94a3b8;">Análise Completa Segundo a Segundo</span></h1>
    
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('zipInput').click()">
      <p>Selecione o ficheiro ZIP gigante exportado do Strava</p>
      <span class="btn">Escolher Ficheiro .ZIP</span>
      <input type="file" id="zipInput" accept=".zip">
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
      <div class="status-text" id="statusText">A aguardar ficheiro...</div>
      <div id="debugError"></div>
    </div>

    <div style="text-align: center;">
      <button class="btn" id="analyzeBtn" style="display: none; margin-top: 20px;" onclick="startAnalysis()">Analisar Todo o Histórico (Pode demorar minutos)</button>
    </div>

    <div class="dashboard" id="dashboard">
      <div style="text-align: center; margin-bottom: 10px;">
        <span id="totalActs" style="color: #94a3b8; font-weight: bold;"></span>
      </div>
      
      <div class="pagination" id="topPagination"></div>
      <div class="activity-grid" id="activityGrid"></div>
      <div class="pagination" id="bottomPagination"></div>
    </div>
  </div>

  <script>
    // Recuperar a função de visualização de erro na tela
    window.onerror = function(msg, url, lineNo) {
      document.getElementById('debugError').innerText = 'ERRO: ' + msg + ' (Linha ' + lineNo + ')';
      return false;
    };

    let activityEntries = [];
    let allActivities = [];
    let currentPage = 1;
    const itemsPerPage = 50;
    let parser = null;

    document.getElementById('zipInput').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('uploadArea').style.display = 'none';
      document.getElementById('progressBox').style.display = 'block';
      updateProgress(5, 'A carregar o ficheiro ZIP para a memória (Por favor, aguarde)...');

      // PAUSA CRUCIAL para o navegador ter tempo de desenhar a interface antes de travar a ler o ZIP
      await new Promise(resolve => setTimeout(resolve, 300));

      try {
        const jszip = new JSZip();
        const zip = await jszip.loadAsync(file);
        
        activityEntries = [];
        zip.forEach((relativePath, zipEntry) => {
          const lowerPath = relativePath.toLowerCase();
          if (lowerPath.match(/\.(fit|gpx|tcx)(\.gz)?$/)) {
            activityEntries.push(zipEntry);
          }
        });

        if (activityEntries.length === 0) throw new Error("Nenhum ficheiro suportado encontrado no ZIP.");
        
        updateProgress(100, `${activityEntries.length} ficheiros localizados! Pronto para iniciar a extração.`);
        document.getElementById('analyzeBtn').style.display = 'inline-block';
      } catch (err) {
        document.getElementById('debugError').innerText = 'Erro: ' + err.message;
      }
    });

    async function decompressGzip(uint8Array) {
      const stream = new Response(uint8Array).body.pipeThrough(new DecompressionStream('gzip'));
      const buffer = await new Response(stream).arrayBuffer();
      return new Uint8Array(buffer);
    }

    // Função de Parser FIT adaptada para evitar falhas do construtor
    function parseFitFile(buffer) {
      return new Promise((resolve, reject) => {
        let FitParserClass = window.FitParser;
        if (typeof FitParserClass !== 'function' && window.FitParser && window.FitParser.default) {
            FitParserClass = window.FitParser.default;
        }
        
        if (!parser) parser = new FitParserClass({ force: true, speedUnit: 'km/h' });
        
        parser.parse(buffer, (error, data) => {
          if (error) reject(error);
          else resolve(data);
        });
      });
    }

    function getRollingMax(records, windowSeconds) {
      if (!records || records.length < 2) return 0;
      let startTime = records[0].time;
      let endTime = records[records.length - 1].time;
      if (endTime - startTime < windowSeconds) return 0;

      let dense = new Int16Array(endTime - startTime + 1);
      let recIdx = 0;
      for (let t = 0; t <= (endTime - startTime); t++) {
        let currentTime = startTime + t;
        while (recIdx < records.length - 1 && records[recIdx + 1].time <= currentTime) recIdx++;
        
        let timeDiff = currentTime - records[recIdx].time;
        if (timeDiff > 10) dense[t] = 0; 
        else dense[t] = records[recIdx].power;
      }

      let maxAvg = 0;
      for (let i = 0; i <= dense.length - windowSeconds; i++) {
        let currentSum = 0;
        let hasData = false;
        for (let j = 0; j < windowSeconds; j++) {
          if (dense[i + j] > 0) {
            currentSum += dense[i + j];
            hasData = true;
          }
        }
        let avg = currentSum / windowSeconds;
        if (hasData && avg > maxAvg) maxAvg = avg;
      }
      return Math.round(maxAvg);
    }

    async function startAnalysis() {
      document.getElementById('analyzeBtn').style.display = 'none';
      allActivities = [];

      for (let i = 0; i < activityEntries.length; i++) {
        // Pausa muito rápida a cada ficheiro para não bloquear o navegador
        if (i % 5 === 0) {
          updateProgress((i / activityEntries.length) * 100, `A extrair dados: ficheiro ${i + 1} de ${activityEntries.length}...`);
          await new Promise(r => setTimeout(r, 0));
        }

        try {
          const entry = activityEntries[i];
          const fileName = entry.name.toLowerCase();
          const rawData = await entry.async("uint8array");
          
          let buffer = rawData;
          if (fileName.endsWith('.gz')) {
            try { buffer = pako.inflate(rawData); } 
            catch (gzErr) { buffer = await decompressGzip(rawData); }
          }

          let records = [];
          let ascent = 0;
          let dateStr = 'Data Desconhecida';
          let timestamp = 0;

          if (fileName.includes('.gpx') || fileName.includes('.tcx')) {
            const text = new TextDecoder().decode(buffer);
            const timeMatch = text.match(/<time>([^<]+)<\/time>|<Id>([^<]+)<\/Id>/i);
            
            if (timeMatch) {
              const d = new Date(timeMatch[1] || timeMatch[2]);
              dateStr = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
              timestamp = d.getTime();
            }

            const eMatches = [...text.matchAll(/<ele>([\d.-]+)<\/ele>|<AltitudeMeters>([\d.-]+)<\/AltitudeMeters>/gi)];
            let lastEle = null;
            for (const m of eMatches) {
              let ele = parseFloat(m[1] || m[2]);
              if (lastEle !== null && ele > lastEle) ascent += (ele - lastEle);
              lastEle = ele;
            }

            const trkpts = [...text.matchAll(/<trkpt[\s\S]*?<\/trkpt>|<Trackpoint>[\s\S]*?<\/Trackpoint>/gi)];
            for (let idx = 0; idx < trkpts.length; idx++) {
              const block = trkpts[idx][0];
              const tMatch = block.match(/<time>([^<]+)<\/time>/i);
              const pMatch = block.match(/<power>(\d+)<\/power>|<[^:]+:power>(\d+)<\/[^:]+:power>|<Watts>(\d+)<\/Watts>/i);
              const hMatch = block.match(/<[^:]+:hr>(\d+)<\/[^:]+:hr>|<HeartRateBpm>[\s\S]*?<Value>(\d+)<\/Value>[\s\S]*?<\/HeartRateBpm>/i);
              const cMatch = block.match(/<[^:]+:cad>(\d+)<\/[^:]+:cad>|<Cadence>(\d+)<\/Cadence>/i);
              
              if (tMatch || idx >= 0) { 
                records.push({ 
                  time: tMatch ? Math.floor(new Date(tMatch[1]).getTime() / 1000) : idx, 
                  power: pMatch ? parseInt(pMatch[1] || pMatch[2] || pMatch[3]) : 0,
                  hr: hMatch ? parseInt(hMatch[1] || hMatch[2]) : 0,
                  cad: cMatch ? parseInt(cMatch[1] || cMatch[2]) : 0
                });
              }
            }
          } 
          else if (fileName.includes('.fit')) {
            let arrayBuffer = buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);
            const data = await parseFitFile(arrayBuffer);
            if (data && data.records) {
              for (const r of data.records) {
                records.push({ 
                  time: r.timestamp ? Math.floor(r.timestamp.getTime() / 1000) : 0, 
                  power: r.power || 0,
                  hr: r.heart_rate || 0,
                  cad: r.cadence || 0
                });
              }
              if (data.sessions && data.sessions[0]) {
                ascent = data.sessions[0].total_ascent || 0;
                if (data.sessions[0].start_time) {
                  const d = new Date(data.sessions[0].start_time);
                  dateStr = d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR');
                  timestamp = d.getTime();
                }
              }
            }
          }

          records.sort((a,b) => a.time - b.time);
          
          let maxPwr = 0, sumPwr = 0, countPwr = 0;
          let maxHR = 0, sumHR = 0, countHR = 0;
          let maxCad = 0, sumCad = 0, countCad = 0;

          records.forEach(r => {
             if (r.power > maxPwr) maxPwr = r.power;
             if (r.power > 0) { sumPwr += r.power; countPwr++; }
             
             if (r.hr > maxHR && r.hr < 220) maxHR = r.hr;
             if (r.hr > 0 && r.hr < 220) { sumHR += r.hr; countHR++; }
             
             if (r.cad > maxCad && r.cad < 180) maxCad = r.cad;
             if (r.cad > 0 && r.cad < 180) { sumCad += r.cad; countCad++; }
          });
          
          let max20m = 0;
          if (countPwr > 50) max20m = getRollingMax(records, 1200);

          if (records.length > 10) {
            allActivities.push({ 
              fileName: entry.name, 
              dateStr, 
              timestamp, 
              ascent: Math.round(ascent),
              max20m,
              maxPwr, avgPwr: countPwr > 0 ? Math.round(sumPwr / countPwr) : 0,
              maxHR, avgHR: countHR > 0 ? Math.round(sumHR / countHR) : 0,
              maxCad, avgCad: countCad > 0 ? Math.round(sumCad / countCad) : 0
            });
          }
        } catch (e) {
          // Ignora a atividade que eventualmente esteja corrompida e avança para a próxima
        }
      }

      // Ordenar por data
      allActivities.sort((a, b) => b.timestamp - a.timestamp);

      updateProgress(100, 'Extração finalizada!');
      document.getElementById('progressBox').style.display = 'none';
      document.getElementById('totalActs').innerText = `Total de Ficheiros Processados: ${allActivities.length}`;
      
      renderPage(1);
    }

    function renderPage(page) {
      currentPage = page;
      document.getElementById('dashboard').style.display = 'block';
      const grid = document.getElementById('activityGrid');
      grid.innerHTML = '';

      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      const pageActs = allActivities.slice(startIndex, endIndex);

      pageActs.forEach(act => {
        const item = document.createElement('div');
        item.className = 'activity-item';
        item.innerHTML = `
          <div class="act-title">${act.dateStr}</div>
          <div class="act-sub">${act.fileName}</div>
          
          <div class="act-stats">
            <div class="stat-box"><div class="stat-label">Pico (1s)</div><div class="stat-val" style="color: #fc5200;">${act.maxPwr > 0 ? act.maxPwr + ' W' : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">Média Movimento</div><div class="stat-val" style="color: #fc5200;">${act.avgPwr > 0 ? act.avgPwr + ' W' : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">Melhor 20 min</div><div class="stat-val" style="color: #fc5200;">${act.max20m > 0 ? act.max20m + ' W' : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">BPM Máx</div><div class="stat-val" style="color: #ef4444;">${act.maxHR > 0 ? act.maxHR : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">BPM Médio</div><div class="stat-val" style="color: #ef4444;">${act.avgHR > 0 ? act.avgHR : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">RPM Média</div><div class="stat-val" style="color: #3b82f6;">${act.avgCad > 0 ? act.avgCad : '--'}</div></div>
            <div class="stat-box"><div class="stat-label">Elevação</div><div class="stat-val" style="color: #10b981;">${act.ascent > 0 ? act.ascent + ' m' : '--'}</div></div>
          </div>
        `;
        grid.appendChild(item);
      });

      renderPagination();
      window.scrollTo(0, 0);
    }

    function renderPagination() {
      const totalPages = Math.ceil(allActivities.length / itemsPerPage);
      let html = '';
      
      let startP = Math.max(1, currentPage - 4);
      let endP = Math.min(totalPages, startP + 9);
      if (endP - startP < 9) startP = Math.max(1, endP - 9);

      if (currentPage > 1) {
        html += `<button class="page-btn" onclick="renderPage(${currentPage - 1})">« Ant</button>`;
      }
      for (let i = startP; i <= endP; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="renderPage(${i})">${i}</button>`;
      }
      if (currentPage < totalPages) {
        html += `<button class="page-btn" onclick="renderPage(${currentPage + 1})">Seg »</button>`;
      }

      document.getElementById('topPagination').innerHTML = html;
      document.getElementById('bottomPagination').innerHTML = html;
    }
  </script>
</body>
</html>
